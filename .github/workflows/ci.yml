name: CI

on:
  pull_request:
    branches: [ "main" ]
  push:
    branches: [ "main" ]


jobs:
  build:
    runs-on: self-hosted  # ← Cambia de ubuntu-latest a self-hosted

# jobs:
#  test:
#    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Show Python
        run: python3 --version
      # - name: Set up Python
      #  uses: actions/setup-python@v5
      #  with:
      #    python-version: "3.11"

      - name: Create virtual environment
        run: python3 -m venv .venv

      - name: Install dependencies
        run: |
          .venv/bin/python -m pip install --upgrade pip
          .venv/bin/python -m pip install -r requirements.txt

      - name: Run tests with coverage
        env:
          PYTHONPATH: ${{ github.workspace }}
        run: |
          .venv/bin/python -m pytest -q --cov=prediction_pipeline_demo --cov-report=term-missing --cov-fail-under=70
      
      ## Ejecuto el pipeline de demostración para asegurarme de que funciona correctamente
      ## Personalice para usar .venv/bin/python
      - name: Run ML demo pipeline
        run: |
          echo "Running prediction pipeline..."
          .venv/bin/python prediction_pipeline_demo.py
